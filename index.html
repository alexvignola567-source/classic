<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mappa dell'Inferno — Divina Commedia</title>
<link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap)" rel="stylesheet">
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --parchment:#f4e4bc;
  --parchment-dark:#e8d4a8;
  --parchment-shadow:#d4c090;
  --ink:#2c1810;
  --ink-light:#5c4030;
  --ink-faded:#8b7355;
  --gold:#c9a227;
  --gold-light:#e8c547;
  --gold-dark:#a07f1c;
  --blood:#8b0000;
  --blood-dark:#5c0000;
  --fire:#d4380d;
  --fire-light:#ff6b35;
  --ice:#4a90a4;
  --ice-light:#7cb8c9;
  --ice-dark:#2d5a6a;
  --shadow:rgba(44,24,16,0.3);
  --font-title:'Cinzel Decorative',serif;
  --font-heading:'Cinzel',serif;
  --font-body:'IM Fell English',Georgia,serif;
  --font-gothic:'UnifrakturMaguntia',cursive;
}

html{font-size:16px;scroll-behavior:smooth}

body{
  font-family:var(--font-body);
  background:var(--parchment);
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='[w3.org](http://www.w3.org/2000/svg)'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"),
    linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 50%, var(--parchment-shadow) 100%);
  color:var(--ink);
  min-height:100vh;
  line-height:1.7;
}

/* Loader medievale */
#loader{
  position:fixed;
  inset:0;
  background:var(--parchment);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  transition:opacity 1s ease,visibility 1s ease;
}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}

.loader-content{text-align:center}
.loader-symbol{
  width:80px;height:80px;
  margin:0 auto 1.5rem;
  animation:flicker 2s infinite ease-in-out;
}
.loader-text{
  font-family:var(--font-gothic);
  font-size:1.4rem;
  color:var(--ink);
  letter-spacing:0.1em;
  margin-bottom:1rem;
}
.loader-quote{
  font-family:var(--font-body);
  font-style:italic;
  color:var(--ink-faded);
  font-size:1rem;
}
.loader-bar{
  width:200px;height:6px;
  background:var(--parchment-shadow);
  border:2px solid var(--ink-faded);
  margin:1.5rem auto 0;
  position:relative;
  overflow:hidden;
}
.loader-progress{
  height:100%;
  background:linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-light));
  width:0;
  animation:loadProgress 2s ease-out forwards;
}

@keyframes loadProgress{to{width:100%}}
@keyframes flicker{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.7;transform:scale(1.05)}
}

/* Header */
header{
  text-align:center;
  padding:1.5rem 1rem;
  background:linear-gradient(180deg,var(--parchment-dark) 0%,transparent 100%);
  border-bottom:3px double var(--ink-faded);
  position:relative;
}
header::before,header::after{
  content:'❧';
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:1.5rem;
  color:var(--gold);
}
header::before{left:2rem}
header::after{right:2rem}

header h1{
  font-family:var(--font-title);
  font-size:clamp(1.6rem,4vw,2.2rem);
  font-weight:700;
  color:var(--ink);
  text-shadow:1px 1px 0 var(--gold);
  letter-spacing:0.15em;
  margin-bottom:0.5rem;
}
header h1::first-letter{
  font-size:1.4em;
  color:var(--blood);
}

/* Breadcrumb */
#breadcrumb{
  display:flex;
  justify-content:center;
  gap:0.5rem;
  flex-wrap:wrap;
  font-family:var(--font-heading);
  font-size:0.85rem;
}
.crumb{
  color:var(--ink-faded);
  cursor:pointer;
  padding:0.25rem 0.5rem;
  transition:color 0.3s ease;
}
.crumb:hover{color:var(--gold-dark)}
.crumb.active{color:var(--ink);font-weight:600}
.crumb:not(:last-child)::after{
  content:' ›';
  color:var(--ink-faded);
  margin-left:0.5rem;
}

/* Main layout */
main{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:1rem;
  max-width:1400px;
  margin:0 auto;
}
@media(min-width:1000px){
  main{
    flex-direction:row;
    gap:2rem;
    padding:2rem;
  }
}

/* Map container */
#map-container{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:500px;
}

.map-view{
  display:none;
  width:100%;
  max-width:700px;
  animation:fadeIn 0.6s ease;
}
.map-view.active{display:block}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

/* Map frame ornamental */
.map-frame{
  background:var(--parchment);
  border:4px solid var(--ink-faded);
  border-radius:8px;
  padding:1rem;
  box-shadow:
    inset 0 0 20px var(--shadow),
    0 8px 30px var(--shadow);
  position:relative;
}
.map-frame::before{
  content:'';
  position:absolute;
  inset:8px;
  border:1px solid var(--ink-faded);
  border-radius:4px;
  pointer-events:none;
}

/* SVG styling */
.map-svg{
  width:100%;
  height:auto;
  display:block;
  overflow:visible;
}

/* Text classes for SVG */
.title-main{
  font-family:'Cinzel Decorative',serif;
  font-size:16px;
  fill:var(--ink);
  font-weight:700;
  letter-spacing:0.1em;
}
.title-location{
  font-family:'Cinzel',serif;
  font-size:11px;
  fill:var(--ink);
  font-weight:600;
  letter-spacing:0.08em;
}
.title-sub{
  font-family:'IM Fell English',serif;
  font-size:10px;
  fill:var(--ink-faded);
  font-style:italic;
}
.label-river{
  font-family:'IM Fell English',serif;
  font-size:9px;
  fill:#1a5276;
  font-style:italic;
  letter-spacing:0.05em;
}
.label-circle{
  font-family:'Cinzel',serif;
  font-size:10px;
  fill:var(--ink);
  font-weight:600;
}
.label-detail{
  font-family:'IM Fell English',serif;
  font-size:8px;
  fill:var(--ink-faded);
}

/* Interactive elements */
.circle-area,.zone-area,.bolgia-area{
  cursor:pointer;
  transition:filter 0.3s ease,transform 0.3s ease;
}
.circle-area:hover,.zone-area:hover,.bolgia-area:hover{
  filter:brightness(1.1) drop-shadow(0 0 8px var(--gold));
}
.circle-area:hover .circle-fill{
  stroke-width:3;
  stroke:var(--gold);
}

/* Flames animation - contained */
@keyframes flameFlicker{
  0%,100%{opacity:0.8;transform:translateY(0) scaleY(1)}
  25%{opacity:1;transform:translateY(-1px) scaleY(1.02)}
  50%{opacity:0.85;transform:translateY(0) scaleY(0.98)}
  75%{opacity:0.95;transform:translateY(-0.5px) scaleY(1.01)}
}
.flame{
  animation:flameFlicker 1.5s infinite ease-in-out;
  transform-origin:center bottom;
}
.flame:nth-child(odd){animation-delay:0.3s}
.flame:nth-child(even){animation-delay:0.7s}

/* Ice shimmer */
@keyframes iceShimmer{
  0%,100%{opacity:0.6}
  50%{opacity:0.9}
}
.ice-crystal{animation:iceShimmer 3s infinite ease-in-out}

/* Info panel */
#info-panel{
  background:var(--parchment);
  border:3px solid var(--ink-faded);
  border-radius:8px;
  padding:1.5rem;
  width:100%;
  max-width:380px;
  max-height:85vh;
  overflow-y:auto;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:200;
  transform:translateY(100%);
  transition:transform 0.4s ease;
  box-shadow:0 -4px 30px var(--shadow);
}
#info-panel.active{transform:translateY(0)}
#info-panel.hidden{transform:translateY(100%)}

@media(min-width:1000px){
  #info-panel{
    position:sticky;
    top:100px;
    bottom:auto;
    transform:translateX(50px);
    opacity:0;
    max-height:calc(100vh - 140px);
    flex-shrink:0;
  }
  #info-panel.active{transform:translateX(0);opacity:1}
  #info-panel.hidden{transform:translateX(50px);opacity:0}
}

#close-panel{
  position:absolute;
  top:0.75rem;
  right:0.75rem;
  background:transparent;
  border:1px solid var(--ink-faded);
  color:var(--ink-faded);
  font-size:1.2rem;
  cursor:pointer;
  width:2rem;
  height:2rem;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  transition:all 0.3s ease;
  font-family:serif;
}
#close-panel:hover{
  background:var(--ink);
  color:var(--parchment);
  border-color:var(--ink);
}

#panel-header{
  margin-bottom:1.25rem;
  padding-bottom:1rem;
  border-bottom:2px solid var(--ink-faded);
}
#panel-category{
  display:inline-block;
  font-family:var(--font-heading);
  font-size:0.7rem;
  color:var(--gold-dark);
  background:rgba(201,162,39,0.15);
  padding:0.2rem 0.6rem;
  border:1px solid var(--gold);
  margin-bottom:0.5rem;
  letter-spacing:0.1em;
}
#panel-title{
  font-family:var(--font-title);
  font-size:1.3rem;
  color:var(--ink);
  font-weight:700;
  line-height:1.3;
}

.info-section{margin-bottom:1.25rem}
.info-section h3{
  font-family:var(--font-heading);
  font-size:0.85rem;
  color:var(--blood);
  margin-bottom:0.4rem;
  letter-spacing:0.05em;
  display:flex;
  align-items:center;
  gap:0.5rem;
}
.info-section h3 svg{width:16px;height:16px;fill:var(--blood)}
.info-section p,.info-section li{
  font-size:0.95rem;
  color:var(--ink);
  line-height:1.6;
}
.info-section ul{list-style:none;padding-left:0}
.info-section li{
  padding:0.25rem 0;
  padding-left:1.2rem;
  position:relative;
}
.info-section li::before{
  content:'•';
  position:absolute;
  left:0;
  color:var(--gold);
}

.quote-section blockquote{
  font-style:italic;
  color:var(--ink-light);
  border-left:3px solid var(--gold);
  padding-left:1rem;
  margin:0;
  line-height:1.7;
  font-size:0.9rem;
}

/* Tooltip */
#tooltip{
  position:fixed;
  background:var(--parchment);
  color:var(--ink);
  padding:0.5rem 0.8rem;
  border:2px solid var(--ink-faded);
  font-size:0.85rem;
  pointer-events:none;
  z-index:1000;
  box-shadow:0 4px 15px var(--shadow);
  max-width:220px;
  transition:opacity 0.15s ease;
}
#tooltip.hidden{opacity:0;visibility:hidden}
#tooltip .tt-title{
  font-family:var(--font-heading);
  font-weight:600;
  color:var(--ink);
  margin-bottom:0.2rem;
}
#tooltip .tt-hint{
  font-size:0.75rem;
  color:var(--ink-faded);
  font-style:italic;
}

/* Footer */
footer{
  background:var(--parchment-dark);
  padding:1.5rem 1rem;
  text-align:center;
  border-top:3px double var(--ink-faded);
}

/* Search */
.search-container{
  position:relative;
  max-width:320px;
  margin:0 auto 1rem;
}
#search-input{
  width:100%;
  padding:0.7rem 1rem;
  font-family:var(--font-body);
  font-size:1rem;
  background:var(--parchment);
  border:2px solid var(--ink-faded);
  color:var(--ink);
  transition:all 0.3s ease;
}
#search-input:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,39,0.2);
}
#search-input::placeholder{color:var(--ink-faded)}

#search-results{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:var(--parchment);
  border:2px solid var(--ink-faded);
  margin-top:0.5rem;
  max-height:250px;
  overflow-y:auto;
  z-index:300;
  box-shadow:0 8px 25px var(--shadow);
}
#search-results.hidden{display:none}

.search-item{
  padding:0.75rem 1rem;
  cursor:pointer;
  transition:background 0.3s ease;
  border-bottom:1px solid var(--parchment-shadow);
}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:rgba(201,162,39,0.1)}
.search-item .result-title{font-weight:600;color:var(--ink)}
.search-item .result-context{font-size:0.85rem;color:var(--ink-faded)}

/* Legend */
.legend{
  display:flex;
  justify-content:center;
  gap:1.5rem;
  flex-wrap:wrap;
  margin-bottom:1rem;
  font-size:0.85rem;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:0.4rem;
  color:var(--ink-faded);
}
.legend-dot{
  width:12px;
  height:12px;
  border:1px solid var(--ink-faded);
}
.legend-dot.incontinence{background:#9b4d5a}
.legend-dot.violence{background:#8b1a1a}
.legend-dot.fraud{background:#5c3d7a}
.legend-dot.treachery{background:#4a90a4}

.credits{
  font-size:0.8rem;
  color:var(--ink-faded);
  font-style:italic;
}

/* Back button */
.back-btn{
  cursor:pointer;
  transition:transform 0.3s ease;
}
.back-btn:hover{transform:scale(1.05)}
.back-btn rect{
  fill:var(--parchment);
  stroke:var(--ink-faded);
  stroke-width:2;
}
.back-btn text{
  font-family:'Cinzel',serif;
  font-size:11px;
  fill:var(--ink);
}

/* Scrollbar */
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--parchment-dark)}
::-webkit-scrollbar-thumb{
  background:var(--ink-faded);
  border:2px solid var(--parchment-dark);
}
::-webkit-scrollbar-thumb:hover{background:var(--ink-light)}

/* Responsive */
@media(max-width:600px){
  header h1{font-size:1.4rem}
  header::before,header::after{display:none}
  #info-panel{
    max-height:70vh;
    border-radius:12px 12px 0 0;
  }
  .legend{font-size:0.75rem;gap:1rem}
}
</style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="loader-content">
    <svg class="loader-symbol" viewBox="0 0 80 80">
      <defs>
        <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" style="stop-color:#8b0000"/>
          <stop offset="50%" style="stop-color:#d4380d"/>
          <stop offset="100%" style="stop-color:#ff6b35"/>
        </linearGradient>
      </defs>
      <path d="M40 5 C30 20, 20 25, 15 40 C10 55, 20 70, 40 75 C60 70, 70 55, 65 40 C60 25, 50 20, 40 5 Z" 
            fill="url(#fireGrad)" opacity="0.9"/>
      <path d="M40 20 C35 30, 30 35, 28 45 C25 55, 32 62, 40 65 C48 62, 55 55, 52 45 C50 35, 45 30, 40 20 Z" 
            fill="#ffcc00" opacity="0.8"/>
      <circle cx="40" cy="50" r="8" fill="#fff" opacity="0.6"/>
    </svg>
    <p class="loader-text">L'Inferno di Dante</p>
    <p class="loader-quote">«Lasciate ogni speranza, voi ch'entrate»</p>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>
</div>

<!-- Header -->
<header>
  <h1>Mappa dell'Inferno</h1>
  <nav id="breadcrumb">
    <span class="crumb active" data-level="0">Inferno</span>
  </nav>
</header>

<!-- Main content -->
<main>
  <section id="map-container">
    
    <!-- Main Inferno Map -->
    <div id="main-map" class="map-view active">
      <div class="map-frame">
        <svg class="map-svg" viewBox="0 0 500 750" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- Gradients -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:0.3"/>
              <stop offset="100%" style="stop-color:#f4e4bc;stop-opacity:0"/>
            </linearGradient>
            
            <linearGradient id="earthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#8b7355"/>
              <stop offset="30%" style="stop-color:#5c4030"/>
              <stop offset="60%" style="stop-color:#3d2914"/>
              <stop offset="100%" style="stop-color:#1a0a0a"/>
            </linearGradient>
            
            <linearGradient id="fireGradient" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" style="stop-color:#5c0000"/>
              <stop offset="50%" style="stop-color:#8b0000"/>
              <stop offset="100%" style="stop-color:#d4380d"/>
            </linearGradient>
            
            <linearGradient id="iceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#7cb8c9"/>
              <stop offset="100%" style="stop-color:#2d5a6a"/>
            </linearGradient>
            
            <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#1a3d5c;stop-opacity:0.8"/>
              <stop offset="50%" style="stop-color:#2d5a7a"/>
              <stop offset="100%" style="stop-color:#1a3d5c;stop-opacity:0.8"/>
            </linearGradient>
            
            <linearGradient id="bloodRiver" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#5c0000;stop-opacity:0.8"/>
              <stop offset="50%" style="stop-color:#8b0000"/>
              <stop offset="100%" style="stop-color:#5c0000;stop-opacity:0.8"/>
            </linearGradient>
            
            <!-- Funnel clip path -->
            <clipPath id="funnelClip">
              <path d="M30 100 L470 100 L380 700 L120 700 Z"/>
            </clipPath>
            
            <!-- Tree pattern for dark forest -->
            <pattern id="forestPattern" width="30" height="30" patternUnits="userSpaceOnUse">
              <rect width="30" height="30" fill="#1a3d1a"/>
              <path d="M5 30 L10 15 L15 30 M20 30 L25 18 L30 30" stroke="#2d5a27" stroke-width="2" fill="none"/>
              <path d="M0 30 L3 20 L6 30" stroke="#1a4a1a" stroke-width="1.5" fill="none"/>
            </pattern>
          </defs>
          
          <!-- Background -->
          <rect width="500" height="750" fill="#f4e4bc"/>
          
          <!-- Decorative border -->
          <rect x="8" y="8" width="484" height="734" fill="none" stroke="#8b7355" stroke-width="2"/>
          <rect x="12" y="12" width="476" height="726" fill="none" stroke="#5c4030" stroke-width="1"/>
          
          <!-- Corner ornaments -->
          <g fill="#8b7355">
            <path d="M15 15 Q25 25, 15 35 Q25 25, 35 15" stroke="#5c4030" stroke-width="1" fill="none"/>
            <path d="M485 15 Q475 25, 485 35 Q475 25, 465 15" stroke="#5c4030" stroke-width="1" fill="none"/>
            <path d="M15 735 Q25 725, 15 715 Q25 725, 35 735" stroke="#5c4030" stroke-width="1" fill="none"/>
            <path d="M485 735 Q475 725, 485 715 Q475 725, 465 735" stroke="#5c4030" stroke-width="1" fill="none"/>
          </g>
          
          <!-- Title cartouche -->
          <g transform="translate(250,35)">
            <path d="M-100 -15 Q-110 0, -100 15 L100 15 Q110 0, 100 -15 Z" fill="#f4e4bc" stroke="#8b7355" stroke-width="2"/>
            <text x="0" y="5" text-anchor="middle" class="title-main">L'INFERNO</text>
          </g>
          
          <!-- Sky area with celestial symbols -->
          <rect x="20" y="55" width="460" height="35" fill="url(#skyGrad)"/>
          <g fill="#c9a227" opacity="0.6">
            <circle cx="60" cy="68" r="4"/>
            <circle cx="440" cy="65" r="3"/>
            <circle cx="120" cy="78" r="2"/>
            <circle cx="380" cy="72" r="2.5"/>
          </g>
          
          <!-- SELVA OSCURA (Dark Forest) -->
          <g class="circle-area" data-area="selva">
            <ellipse cx="250" cy="82" rx="185" ry="22" fill="url(#forestPattern)"/>
            <ellipse cx="250" cy="82" rx="185" ry="22" fill="none" stroke="#2d5a27" stroke-width="2" class="circle-fill"/>
            <!-- Trees -->
            <g stroke="#1a4a1a" stroke-width="2" fill="none">
              <path d="M85 90 L92 68 L99 90"/>
              <path d="M135 88 L147 62 L159 88"/>
              <path d="M205 90 L213 67 L221 90"/>
              <path d="M279 90 L287 67 L295 90"/>
              <path d="M341 88 L353 62 L365 88"/>
              <path d="M405 90 L412 68 L419 90"/>
            </g>
            <text x="250" y="86" text-anchor="middle" class="title-location">SELVA OSCURA</text>
          </g>
          
          <!-- PORTA DELL'INFERNO -->
          <g class="circle-area" data-area="porta">

// Search function
function search(query) {
  const results = [];
  const q = query.toLowerCase().trim();
  if (q.length < 2) return results;
  
  for (const [key, data] of Object.entries(DATA)) {
    let score = 0;
    let matchedField = "";
    
    if (data.nome.toLowerCase().includes(q)) {
      score += 10;
      matchedField = data.nome;
    }
    if (data.nomeLungo && data.nomeLungo.toLowerCase().includes(q)) {
      score += 8;
      matchedField = matchedField || data.nomeLungo;
    }
    if (data.personaggi) {
      for (const p of data.personaggi) {
        if (p.toLowerCase().includes(q)) {
          score += 6;
          matchedField = matchedField || p;
          break;
        }
      }
    }
    if (data.peccato && data.peccato.toLowerCase().includes(q)) {
      score += 4;
      matchedField = matchedField || "Peccato";
    }
    
    if (score > 0) {
      results.push({ id: key, data, score, matchedField });
    }
  }
  
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 8);
}

// DOM Ready
document.addEventListener('DOMContentLoaded', () => {
  const loader = document.getElementById('loader');
  const breadcrumb = document.getElementById('breadcrumb');
  const infoPanel = document.getElementById('info-panel');
  const closePanel = document.getElementById('close-panel');
  const tooltip = document.getElementById('tooltip');
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  
  let currentView = 'main';
  let navStack = ['Inferno'];
  
  // Hide loader
  setTimeout(() => loader.classList.add('hidden'), 2500);
  
  // Switch map view
  function switchMap(id) {
    document.querySelectorAll('.map-view').forEach(m => m.classList.remove('active'));
    const target = document.getElementById(id);
    if (target) target.classList.add('active');
    
    if (id === 'main-map') {
      currentView = 'main';
      navStack = ['Inferno'];
    } else {
      const circle = id.replace('map-', '');
      currentView = circle;
      navStack = ['Inferno', getCircleName(circle)];
    }
    updateBreadcrumb();
    hidePanel();
    initInteractions();
  }
  
  function getCircleName(c) {
    const names = {
      '7': 'VII Cerchio — Violenti',
      '8': 'VIII Cerchio — Malebolge',
      '9': 'IX Cerchio — Cocito'
    };
    return names[c] || `Cerchio ${c}`;
  }
  
  function updateBreadcrumb() {
    breadcrumb.innerHTML = '';
    navStack.forEach((name, i) => {
      const crumb = document.createElement('span');
      crumb.className = 'crumb';
      crumb.textContent = name;
      crumb.dataset.level = i;
      if (i === navStack.length - 1) {
        crumb.classList.add('active');
      } else {
        crumb.addEventListener('click', () => {
          if (i === 0) switchMap('main-map');
        });
      }
      breadcrumb.appendChild(crumb);
    });
  }
  
  // Initialize interactions
  function initInteractions() {
    // Main circle areas
    document.querySelectorAll('.circle-area').forEach(area => {
      area.addEventListener('click', handleCircleClick);
      area.addEventListener('mouseenter', handleMouseEnter);
      area.addEventListener('mouseleave', handleMouseLeave);
    });
    
    // Zone areas (VII, IX)
    document.querySelectorAll('.zone-area').forEach(area => {
      area.addEventListener('click', handleSubClick);
      area.addEventListener('mouseenter', handleMouseEnter);
      area.addEventListener('mouseleave', handleMouseLeave);
    });
    
    // Bolgia areas (VIII)
    document.querySelectorAll('.bolgia-area').forEach(area => {
      area.addEventListener('click', handleSubClick);
      area.addEventListener('mouseenter', handleMouseEnter);
      area.addEventListener('mouseleave', handleMouseLeave);
    });
    
    // Back buttons
    document.querySelectorAll('.back-btn').forEach(btn => {
      btn.addEventListener('click', () => switchMap('main-map'));
    });
  }
  
  function handleCircleClick() {
    const circleId = this.dataset.cerchio || this.dataset.area;
    const data = DATA[circleId];
    if (!data) return;
    
    if (data.hasSubmap && ['7', '8', '9'].includes(circleId)) {
      switchMap('map-' + circleId);
    } else {
      showPanel(data);
    }
  }
  
  function handleSubClick() {
    const id = this.dataset.girone || this.dataset.bolgia || this.dataset.zona || this.dataset.area;
    const data = DATA[id];
    if (data) showPanel(data);
  }
  
  function handleMouseEnter(e) {
    const id = this.dataset.cerchio || this.dataset.girone || this.dataset.bolgia || this.dataset.zona || this.dataset.area;
    const data = DATA[id];
    if (!data) return;
    
    tooltip.innerHTML = `
      <div class="tt-title">${data.nome}</div>
      <div class="tt-hint">${data.hasSubmap ? 'Clicca per esplorare' : 'Clicca per dettagli'}</div>
    `;
    tooltip.classList.remove('hidden');
    positionTooltip(e);
    this.addEventListener('mousemove', positionTooltip);
  }
  
  function handleMouseLeave() {
    tooltip.classList.add('hidden');
    this.removeEventListener('mousemove', positionTooltip);
  }
  
  function positionTooltip(e) {
    const x = e.clientX + 15;
    const y = e.clientY + 15;
    const rect = tooltip.getBoundingClientRect();
    const maxX = window.innerWidth - rect.width - 20;
    const maxY = window.innerHeight - rect.height - 20;
    tooltip.style.left = Math.min(x, maxX) + 'px';
    tooltip.style.top = Math.min(y, maxY) + 'px';
  }
  
  // Panel functions
  function showPanel(data) {
    let category = '';
    if (data.id.includes('-')) {
      const [c] = data.id.split('-');
      const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][parseInt(c) - 1] || c.toUpperCase();
      category = roman + ' CERCHIO';
    } else if (data.id === 'lucifero') {
      category = "CENTRO DELL'INFERNO";
    } else if (data.id === '0') {
      category = 'ANTI-INFERNO';
    } else if (data.canti && !isNaN(parseInt(data.id))) {
      const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'][parseInt(data.id) - 1] || data.id.toUpperCase();
      category = roman + ' CERCHIO';
    }
    
    document.getElementById('panel-category').textContent = category;
    document.getElementById('panel-title').textContent = data.nomeLungo || data.nome;
    document.getElementById('info-canto').textContent = data.canti ? 'Canto ' + data.canti : '—';
    document.getElementById('info-peccato').textContent = data.peccato || '—';
    document.getElementById('info-pena').textContent = data.pena || '—';
    
    const custodeSection = document.getElementById('custode-section');
    const infoCustode = document.getElementById('info-custode');
    if (data.custode) {
      infoCustode.textContent = data.custode;
      custodeSection.style.display = 'block';
    } else {
      custodeSection.style.display = 'none';
    }
    
    const personaggiList = document.getElementById('info-personaggi');
    personaggiList.innerHTML = '';
    if (data.personaggi && data.personaggi.length) {
      data.personaggi.forEach(p => {
        const li = document.createElement('li');
        li.textContent = p;
        personaggiList.appendChild(li);
      });
    } else {
      const li = document.createElement('li');
      li.textContent = 'Nessun personaggio menzionato';
      personaggiList.appendChild(li);
    }
    
    const ambienteSection = document.getElementById('ambiente-section');
    const infoAmbiente = document.getElementById('info-ambiente');
    if (data.ambiente) {
      infoAmbiente.textContent = data.ambiente;
      ambienteSection.style.display = 'block';
    } else {
      ambienteSection.style.display = 'none';
    }
    
    document.getElementById('info-citazione').textContent = data.citazione || '«...»';
    
    infoPanel.classList.remove('hidden');
    infoPanel.classList.add('active');
  }
  
  function hidePanel() {
    infoPanel.classList.remove('active');
    infoPanel.classList.add('hidden');
  }
  
  closePanel.addEventListener('click', hidePanel);
  
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      hidePanel();
      searchResults.classList.add('hidden');
    }
  });
  
  // Search
  let searchTimeout;
  searchInput.addEventListener('input', e => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      const query = e.target.value;
      if (query.length < 2) {
        searchResults.classList.add('hidden');
        return;
      }
      
      const results = search(query);
      if (!results.length) {
        searchResults.innerHTML = '<div class="search-item"><div class="result-title">Nessun risultato</div></div>';
      } else {
        searchResults.innerHTML = results.map(r => `
          <div class="search-item" data-id="${r.id}">
            <div class="result-title">${r.data.nome}</div>
            <div class="result-context">${r.matchedField}</div>
          </div>
        `).join('');
        
        searchResults.querySelectorAll('.search-item').forEach(item => {
          item.addEventListener('click', () => {
            const id = item.dataset.id;
            const data = DATA[id];
            if (data) {
              if (data.parent) {
                switchMap('map-' + data.parent);
                setTimeout(() => showPanel(data), 400);
              } else if (data.hasSubmap) {
                switchMap('map-' + id);
              } else {
                if (currentView !== 'main' && !id.includes('-')) {
                  switchMap('main-map');
                  setTimeout(() => showPanel(data), 400);
                } else {
                  showPanel(data);
                }
              }
              searchResults.classList.add('hidden');
              searchInput.value = '';
            }
          });
        });
      }
      searchResults.classList.remove('hidden');
    }, 200);
  });
  
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-container')) {
      searchResults.classList.add('hidden');
    }
  });
  
  // Initialize
  initInteractions();
});
</script>
