
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantaLega Classic</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1>⚽ FantaLega Classic</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#leagues">Leagues</a>
      <a href="#profile">Profile</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h2>Il Fantacalcio di una volta</h2>
      <p>Create leagues, manage friends, and play fantasy football.</p>
      <button id="ctaBtn">Create League</button>
    </section>

    <section id="leagues">
      <h2>Your Leagues</h2>
      <div class="card-grid">
        <div class="card">Serie A League</div>
        <div class="card">Friends League</div>
        <div class="card">Classic Cup</div>
      </div>
    </section>

    <section id="profile">
      <h2>Profile</h2>
      <p>Manage your account and avatar.</p>
    </section>
  </main>

  <footer>
    <p>© 2026 FantaLega Classic</p>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
