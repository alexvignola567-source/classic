<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaLega Classic - Il Fantacalcio di una volta</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Auth Container -->
        <div id="auth-container" class="container">
            <div class="auth-box">
                <div class="auth-logo">
                    <div class="auth-logo-icon"><i class="fas fa-futbol"></i></div>
                    <h1>FantaLega Classic</h1>
                    <p>Il Fantacalcio come una volta</p>
                </div>
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="login-email" required autocomplete="email" placeholder="nome@esempio.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-gold btn-full"><i class="fas fa-sign-in-alt"></i> Entra in campo</button>
                    <p class="switch-form">Nuovo giocatore? <a href="#" id="show-register">Registrati ora</a></p>
                </form>
                <form id="register-form" class="auth-form hidden">
                    <div class="form-group">
                        <label for="register-name"><i class="fas fa-user"></i> Nome Allenatore</label>
                        <input type="text" id="register-name" required autocomplete="name" placeholder="Il tuo nome">
                    </div>
                    <div class="form-group">
                        <label for="register-email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="register-email" required autocomplete="email" placeholder="nome@esempio.com">
                    </div>
                    <div class="form-group">
                        <label for="register-password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="register-password" minlength="6" required autocomplete="new-password" placeholder="Minimo 6 caratteri">
                    </div>
                    <button type="submit" class="btn btn-gold btn-full"><i class="fas fa-user-plus"></i> Crea il tuo account</button>
                    <p class="switch-form">Già registrato? <a href="#" id="show-login">Accedi</a></p>
                </form>
                <div id="auth-message" class="message"></div>
            </div>
        </div>
        <!-- Home Container -->
        <div id="home-container" class="container hidden">
            <header>
                <div class="header-top-bar">
                    <span><i class="fas fa-calendar-alt"></i> Stagione 2025/2026 | <i class="fas fa-clock"></i> <span id="current-time"></span></span>
                </div>
                <nav>
                    <div class="logo" onclick="App.showSection('home')">
                        <div class="logo-icon"><i class="fas fa-futbol"></i></div>
                        <div class="logo-text">
                            <span class="logo-title">FantaLega Classic</span>
                            <span class="logo-subtitle">Il Fantacalcio di una volta</span>
                        </div>
                    </div>
                    <div class="nav-user">
                        <span id="user-greeting"></span>
                        
                        <!-- Notification Bell -->
                        <div class="nav-avatar-container">
                            <div class="notification-bell" id="notification-bell">
                                <i class="fas fa-bell"></i>
                                <span id="notification-badge" class="badge hidden">0</span>
                            </div>
                            <div class="notification-dropdown" id="notification-dropdown">
                                <div class="notification-header">
                                    <h3><i class="fas fa-bell"></i> Notifiche</h3>
                                    <button class="btn btn-ghost btn-sm" id="mark-all-read">Segna lette</button>
                                </div>
                                <div class="notification-list" id="notification-list">
                                    <div class="notification-empty">
                                        <div class="notification-empty-icon"><i class="fas fa-bell-slash"></i></div>
                                        <p>Nessuna notifica</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="nav-avatar-container">
                            <div class="nav-avatar" id="nav-avatar">M</div>
                            <div class="nav-dropdown" id="nav-dropdown">
                                <div class="nav-dropdown-header">
                                    <div class="nav-dropdown-name" id="dropdown-name">Nome</div>
                                    <div class="nav-dropdown-id" id="dropdown-id">#000000</div>
                                </div>
                                <div class="nav-dropdown-menu">
                                    <button class="nav-dropdown-item" data-section="profile">
                                        <span class="nav-dropdown-icon"><i class="fas fa-user-circle"></i></span>
                                        Il mio profilo
                                    </button>
                                    <button class="nav-dropdown-item" data-section="teams">
                                        <span class="nav-dropdown-icon"><i class="fas fa-shield-alt"></i></span>
                                        Le mie Squadre
                                    </button>
                                    <button class="nav-dropdown-item" data-section="friends">
                                        <span class="nav-dropdown-icon"><i class="fas fa-users"></i></span>
                                        Compagni di Lega
                                    </button>
                                    
                                    <div class="nav-dropdown-divider"></div>
                                    <div class="nav-dropdown-section-title"><i class="fas fa-trophy"></i> Le tue Leghe</div>
                                    <div class="nav-groups-list" id="nav-groups-list"></div>
                                    
                                    <div class="nav-dropdown-divider"></div>
                                    <button class="nav-dropdown-item danger" id="dropdown-logout">
                                        <span class="nav-dropdown-icon"><i class="fas fa-sign-out-alt"></i></span>
                                        Esci
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </nav>
            </header>
            <main>
                <!-- Home Section -->
                <section id="section-home" class="section"></section>
                <!-- Profile Section -->
                <section id="section-profile" class="section hidden"></section>
                <!-- Friends Section -->
                <section id="section-friends" class="section hidden"></section>
                <!-- Teams Section -->
                <section id="section-teams" class="section hidden"></section>
                <!-- League Detail Section -->
                <section id="section-group" class="section hidden"></section>
            </main>
            <footer>
                <p><i class="fas fa-futbol"></i> FantaLega Classic © 2025 - Il Fantacalcio come una volta</p>
            </footer>
        </div>
        <!-- Toast Container -->
        <div class="toast-container" id="toast-container"></div>
        <!-- Modals Container -->
        <div id="modals-container"></div>
    </div>
    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db/database.js"></script>
    <script src="js/db/users.js"></script>
    <script src="js/db/friends.js"></script>
    <script src="js/db/groups.js"></script>
    <script src="js/db/teams.js"></script>
    <script src="js/db/notifications.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/modal.js"></script>
    <script src="js/ui/dropdowns.js"></script>
    <script src="js/ui/navigation.js"></script>
    <script src="js/components/avatars.js"></script>
    <script src="js/components/cards.js"></script>
    <script src="js/components/forms.js"></script>
    <script src="js/sections/auth.js"></script>
    <script src="js/sections/home.js"></script>
    <script src="js/sections/profile.js"></script>
    <script src="js/sections/friends.js"></script>
    <script src="js/sections/groups.js"></script>
    <script src="js/sections/teams.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
